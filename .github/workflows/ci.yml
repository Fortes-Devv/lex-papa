name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores fictícios: o CI nunca conecta no banco (prisma generate não conecta
      # e os testes simulam o banco). O build roda na Vercel, que tem as variáveis reais.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # mesma versão do ambiente de desenvolvimento (npm 11 gera o lockfile)
          cache: npm
      - name: Instalar dependências
        # npm install (e não npm ci): o npm 11 no Windows às vezes deixa @emnapi/* fora do
        # lockfile e o npm ci no Linux recusa. As versões continuam vindo do lockfile.
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Prisma generate
        run: npx prisma generate
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
